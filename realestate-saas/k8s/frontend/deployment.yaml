apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: realestate-saas
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: frontend
          image: YOUR_ECR_REPO/realestate-frontend:latest  # 要変更
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: realestate-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: realestate-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
          envFrom:
            - configMapRef:
                name: realestate-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
      restartPolicy: Always
