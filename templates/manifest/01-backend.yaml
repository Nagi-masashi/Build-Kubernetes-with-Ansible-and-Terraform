---
# ── Backend Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vertical-ai
  labels:
    app: backend
spec:
  replicas: 2                  # Start with 2; HPA will scale up automatically
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # Zero-downtime deploy
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Pull from AWS ECR (replace ACCOUNT_ID and REGION)
      # image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/vertical-ai-backend:latest
      containers:
        - name: backend
          image: vertical-ai-backend:latest    # Replace with ECR URI
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: FRONTEND_URL
              value: "https://your-domain.com"   # Replace with actual domain
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claude-secret
                  key: ANTHROPIC_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true

---
# ── Backend Service (ClusterIP — only reachable inside the cluster) ────────────
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: vertical-ai
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001

---
# ── Horizontal Pod Autoscaler ──────────────────────────────────────────────────
# Scale out when average CPU exceeds 60% — handles traffic spikes from viral posts
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: vertical-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
